name: cortex-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  db:
    image: postgres:16
    container_name: cortex_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Defina DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?Defina DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}' ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: cortex_prod_redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  web:
    image: cortex-app:prod
    build: *app-build
    container_name: cortex_prod_web
    restart: unless-stopped
    command: [ "gunicorn", "-c", "/app/docker/gunicorn.conf.py", "Cortex.wsgi:application" ]
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Defina ALLOWED_HOSTS},127.0.0.1
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/cortex/health/')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  worker:
    image: cortex-app:prod
    build: *app-build
    container_name: cortex_prod_worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - Cortex
      - worker
      - -l
      - INFO
      - --pool
      - prefork
      - --concurrency
      - "${CELERY_CONCURRENCY:-4}"
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging

  beat:
    image: cortex-app:prod
    build: *app-build
    container_name: cortex_prod_beat
    restart: unless-stopped
    command:
      - celery
      - -A
      - Cortex
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - beat_data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: cortex_prod_nginx
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/docker-entrypoint-cortex.sh" ]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CORTEX_DOMAIN: ${CORTEX_DOMAIN:-_}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/templates:/etc/nginx/templates-src:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-cortex.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - tools
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: [ "certbot" ]

volumes:
  postgres_data:
  redis_data:
  media_data:
  beat_data:
  certbot_www:
  certbot_certs:
