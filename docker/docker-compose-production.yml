services:
  db:
    image: postgres:16
    container_name: cortex_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cortex}
      POSTGRES_USER: ${DATABASE_USER:-cortex}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cortex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-cortex} -d ${DATABASE_NAME:-cortex}' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortex_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cortex_web
    command: >
      sh -c "python manage.py migrate && gunicorn Cortex.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env.docker
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cortex_worker
    command: celery -A Cortex worker -l INFO --pool=prefork --concurrency=${CELERY_CONCURRENCY:-4}
    env_file:
      - .env.docker
    environment:
      DJANGO_DEBUG: "False"
      DATABASE_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
