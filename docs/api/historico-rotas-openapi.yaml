openapi: 3.0.3
info:
  title: Cortex
  version: 1.0.0
paths:
  /cortex/transporte/motorista/historico-rotas/:
    get:
      operationId: root_list
      description: |-
        Inclui somente viagens finalizadas pelo motorista. Preserva rotas e percursos desativados. Presentes conta tickets embarcados, ausentes conta tickets ausentes e sem_ticket conta entradas registradas sem ticket. Filtros inválidos são ignorados.

        **Permissões:** Motorista ativo ou L3 (administrador). Todos consultam as viagens concluídas de todos os motoristas. Alunos, conferentes sem perfil motorista e L2 não têm acesso.
      summary: Listar histórico de rotas executadas
      parameters:
      - in: query
        name: busca
        schema:
          type: string
        description: Apelido, descrição do percurso ou data (DD/MM/AAAA ou AAAA-MM-DD).
      - in: query
        name: data
        schema:
          type: string
          format: date
      - in: query
        name: ordenacao
        schema:
          type: string
          enum:
          - -data
          - -horario
          - -percurso
          - data
          - horario
          - percurso
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Itens por página, entre 1 e 100.
      - in: query
        name: percurso_id
        schema:
          type: integer
      tags:
      - Transporte · Motorista
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoricoRotaList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Perfil sem acesso ao histórico.
          description: ''
  /cortex/transporte/motorista/historico-rotas/{id}/:
    get:
      operationId: root_retrieve
      description: |-
        Horários, duração, responsável e nomes dos passageiros por categoria. Não expõe CPF, contatos nem informações clínicas.

        **Permissões:** Motorista ativo ou L3 (administrador). Todos consultam as viagens concluídas de todos os motoristas. Alunos, conferentes sem perfil motorista e L2 não têm acesso.
      summary: Detalhar rota executada
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Transporte · Motorista
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheHistoricoRota'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Perfil sem acesso ao histórico.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Viagem inexistente ou ainda não concluída.
          description: ''
  /cortex/transporte/motorista/historico-rotas/percursos/:
    get:
      operationId: percursos_list
      description: |-
        Opções do filtro, incluindo percursos desativados com histórico.

        **Permissões:** Motorista ativo ou L3 (administrador). Todos consultam as viagens concluídas de todos os motoristas. Alunos, conferentes sem perfil motorista e L2 não têm acesso.
      summary: Listar percursos com viagens concluídas
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: paginacao
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - Transporte · Motorista
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPercursoHistoricoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Perfil sem acesso ao histórico.
          description: ''
  /cortex/transporte/execucoes-rotas/historico/:
    get:
      operationId: transporte_execucoes_rotas_historico_list
      description: |-
        Inclui somente viagens finalizadas pelo motorista. Mesmos filtros e contagens do histórico do motorista. O conferente autenticado no finalizar não aparece na lista. Filtros inválidos são ignorados e apenas reduzem o conjunto, nunca expandem o acesso.

        **Permissões:** capacidade `transporte.conferir` (conferente) ou L3 (administrador). Alunos, L2 sem conferir e motoristas sem conferir não têm acesso.
      summary: Listar histórico da conferência
      parameters:
      - in: query
        name: busca
        schema:
          type: string
        description: Apelido, descrição do percurso ou data (DD/MM/AAAA ou AAAA-MM-DD). Apenas reduz o conjunto visível, nunca expande o acesso. Valor inválido é ignorado.
      - in: query
        name: data
        schema:
          type: string
          format: date
        description: Filtra pela data da execução. Apenas reduz o conjunto visível, nunca expande o acesso. Valor inválido é ignorado.
      - in: query
        name: ordenacao
        schema:
          type: string
          enum:
          - -data
          - -horario
          - -percurso
          - data
          - horario
          - percurso
        description: Ordenação da lista. Valor fora do enum usa o padrão (-data). Apenas reduz o conjunto visível, nunca expande o acesso. Valor inválido é ignorado.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Itens por página, entre 1 e 100.
      - in: query
        name: percurso_id
        schema:
          type: integer
        description: Filtra pelo percurso. Apenas reduz o conjunto visível, nunca expande o acesso. Valor inválido é ignorado.
      tags:
      - Transporte · Histórico de viagens
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoricoRotaList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Perfil sem capacidade conferir.
          description: ''
  /cortex/transporte/execucoes-rotas/historico/{id}/:
    get:
      operationId: transporte_execucoes_rotas_historico_retrieve
      description: |-
        Horários, conferente que finalizou a conferência e alunos (id, nome, CPF, tem_deficiencia) por categoria. Sem foto nem tipo clínico.

        **Permissões:** capacidade `transporte.conferir` (conferente) ou L3 (administrador). Alunos, L2 sem conferir e motoristas sem conferir não têm acesso.
      summary: Detalhar viagem no histórico da conferência
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Transporte · Histórico de viagens
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheHistoricoConferencia'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Perfil sem capacidade conferir.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Viagem inexistente ou ainda não concluída.
          description: ''
  /cortex/transporte/execucoes-rotas/historico/percursos/:
    get:
      operationId: transporte_execucoes_rotas_historico_percursos_list
      description: |-
        Opções do filtro, incluindo percursos desativados com histórico.

        **Permissões:** capacidade `transporte.conferir` (conferente) ou L3 (administrador). Alunos, L2 sem conferir e motoristas sem conferir não têm acesso.
      summary: Listar percursos com viagens no histórico da conferência
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: paginacao
        required: false
        in: query
        description: Itens por página, entre 1 e 100.
        schema:
          type: integer
      tags:
      - Transporte · Histórico de viagens
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPercursoHistoricoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Perfil sem capacidade conferir.
          description: ''
components:
  schemas:
    AlunoHistoricoConferencia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          readOnly: true
        cpf:
          type: string
          readOnly: true
        tem_deficiencia:
          type: boolean
          readOnly: true
      required:
      - cpf
      - id
      - nome
      - tem_deficiencia
    ConferenteHistorico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          readOnly: true
      required:
      - id
      - nome
    DetalheHistoricoConferencia:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        data:
          type: string
          format: date
          readOnly: true
        horario:
          type: string
          readOnly: true
        percurso:
          allOf:
          - $ref: '#/components/schemas/PercursoHistorico'
          readOnly: true
        presentes:
          type: integer
          readOnly: true
        ausentes:
          type: integer
          readOnly: true
        sem_ticket:
          type: integer
          readOnly: true
        rota_iniciada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rota_finalizada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duracao_rota_segundos:
          type: integer
          readOnly: true
          nullable: true
        percurso_descricao:
          type: string
          readOnly: true
        quantidade_vagas:
          type: integer
          readOnly: true
          title: Quantidade de vagas
        conferencia_finalizada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        conferencia_finalizada_por:
          allOf:
          - $ref: '#/components/schemas/ConferenteHistorico'
          readOnly: true
          nullable: true
        tickets_presentes:
          type: array
          items:
            $ref: '#/components/schemas/AlunoHistoricoConferencia'
          readOnly: true
        tickets_ausentes:
          type: array
          items:
            $ref: '#/components/schemas/AlunoHistoricoConferencia'
          readOnly: true
        passageiros_sem_ticket:
          type: array
          items:
            $ref: '#/components/schemas/AlunoHistoricoConferencia'
          readOnly: true
      required:
      - ausentes
      - conferencia_finalizada_em
      - conferencia_finalizada_por
      - data
      - duracao_rota_segundos
      - horario
      - id
      - passageiros_sem_ticket
      - percurso
      - percurso_descricao
      - presentes
      - quantidade_vagas
      - rota_finalizada_em
      - rota_iniciada_em
      - sem_ticket
      - tickets_ausentes
      - tickets_presentes
    DetalheHistoricoRota:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        data:
          type: string
          format: date
          readOnly: true
        horario:
          type: string
          readOnly: true
        percurso:
          allOf:
          - $ref: '#/components/schemas/PercursoHistorico'
          readOnly: true
        presentes:
          type: integer
          readOnly: true
        ausentes:
          type: integer
          readOnly: true
        sem_ticket:
          type: integer
          readOnly: true
        rota_iniciada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rota_finalizada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duracao_rota_segundos:
          type: integer
          readOnly: true
          nullable: true
        percurso_descricao:
          type: string
          readOnly: true
        motorista_nome:
          type: string
          readOnly: true
          nullable: true
        quantidade_vagas:
          type: integer
          readOnly: true
          title: Quantidade de vagas
        tickets_presentes:
          type: array
          items:
            $ref: '#/components/schemas/PassageiroHistorico'
          readOnly: true
        tickets_ausentes:
          type: array
          items:
            $ref: '#/components/schemas/PassageiroHistorico'
          readOnly: true
        passageiros_sem_ticket:
          type: array
          items:
            $ref: '#/components/schemas/PassageiroHistorico'
          readOnly: true
      required:
      - ausentes
      - data
      - duracao_rota_segundos
      - horario
      - id
      - motorista_nome
      - passageiros_sem_ticket
      - percurso
      - percurso_descricao
      - presentes
      - quantidade_vagas
      - rota_finalizada_em
      - rota_iniciada_em
      - sem_ticket
      - tickets_ausentes
      - tickets_presentes
    HistoricoRota:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        data:
          type: string
          format: date
          readOnly: true
        horario:
          type: string
          readOnly: true
        percurso:
          allOf:
          - $ref: '#/components/schemas/PercursoHistorico'
          readOnly: true
        presentes:
          type: integer
          readOnly: true
        ausentes:
          type: integer
          readOnly: true
        sem_ticket:
          type: integer
          readOnly: true
        rota_iniciada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rota_finalizada_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duracao_rota_segundos:
          type: integer
          readOnly: true
          nullable: true
      required:
      - ausentes
      - data
      - duracao_rota_segundos
      - horario
      - id
      - percurso
      - presentes
      - rota_finalizada_em
      - rota_iniciada_em
      - sem_ticket
    PaginatedHistoricoRotaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/HistoricoRota'
    PaginatedPercursoHistoricoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PercursoHistorico'
    PassageiroHistorico:
      type: object
      properties:
        nome:
          type: string
          readOnly: true
      required:
      - nome
    PercursoHistorico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        apelido:
          type: string
          readOnly: true
      required:
      - apelido
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
