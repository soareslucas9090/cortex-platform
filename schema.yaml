        para **todos** os recursos\n    informados, conforme as regras de elegibilidade
        (retirada irrestrita, servidor,\n    terceirizado em chaves, SalaSetor, autorização).\n\n
        \   Informe um ou mais IDs em `recurso_id` e/ou `recurso_ids` (repetidos ou
        separados\n    por vírgula). A resposta contém apenas usuários elegíveis a
        cada recurso enviado.\n\n    **Permissões:** Capacidade `operar` em Infraestrutura.\n
        \   "
      summary: Listar solicitantes elegíveis para recurso(s)
