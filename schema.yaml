        \   **Permissões:** Qualquer usuário autenticado (catálogo de referência).
        Escrita apenas L3 (EDITAR_TUDO).\n    "
      summary: Atualizar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarCurso'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou código já em uso.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
  /cortex/academico/cursos/{id}/desativar/:
    post:
      operationId: academico_cursos_desativar_create
      description: "\n    Desativa um curso ativo.\n\n    **Permissões:** Qualquer
        usuário autenticado (catálogo de referência). Escrita apenas L3 (EDITAR_TUDO).\n
        \   "
      summary: Desativar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Curso já está inativo.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
  /cortex/academico/cursos/{id}/reativar/:
    post:
      operationId: academico_cursos_reativar_create
      description: "\n    Reativa um curso inativo.\n\n    **Permissões:** Qualquer
        usuário autenticado (catálogo de referência). Escrita apenas L3 (EDITAR_TUDO).\n
        \   "
      summary: Reativar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Curso já está ativo.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
  /cortex/auth/token_jwt/:
    post:
      operationId: auth_token_jwt_create
      description: "\n        Autentica o usuário e retorna os tokens de acesso (access)
        e renovação (refresh).\n\n        **Permissões:** Público (AllowAny — não
        requer autenticação).\n\n        O campo ``login`` aceita **e-mail** ou **CPF**
        (com ou sem máscara).\n\n        **Exemplos de identificador:**\n        -
        E-mail: `usuario@email.com`\n        - CPF sem máscara: `12345678901`\n        -
        CPF com máscara: `123.456.789-01`\n\n        **Token de acesso:** válido por
        30 minutos.\n        **Token de renovação:** válido por 7 dias.\n\n        Em
        caso de falha, a resposta é sempre genérica e não revela\n        o motivo
        específico (usuário inexistente, senha incorreta ou inativo).\n        "
      summary: Login — obter tokens JWT
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Credenciais inválidas.
          description: ''
  /cortex/auth/token_jwt/me/:
    get:
      operationId: auth_token_jwt_me_retrieve
      description: "\n        Retorna as informações do usuário atual, incluindo suas
        permissões.\n\n        **Permissões:** Qualquer usuário autenticado (L1–L3).\n
        \       "
      summary: Dados do usuário logado
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
  /cortex/auth/token_jwt/refresh/:
    post:
      operationId: auth_token_jwt_refresh_create
      description: "\n        Usa o refresh token para emitir um novo access token
        sem precisar de nova autenticação.\n\n        **Permissões:** Público (AllowAny
        — não requer autenticação).\n        "
      summary: Renovar token de acesso
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Novo access token gerado.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Refresh token inválido ou expirado.
          description: ''
  /cortex/auth/token_jwt/verify/:
    post:
      operationId: auth_token_jwt_verify_create
      description: "\n        Retorna 200 se o token for válido, 401 caso contrário.\n\n
        \       **Permissões:** Público (AllowAny — não requer autenticação).\n        "
      summary: Verificar validade do token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Token válido.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Token inválido ou expirado.
          description: ''
  /cortex/identidade/permissoes/documentacao/:
    get:
      operationId: identidade_permissoes_documentacao_retrieve
      description: "\n    Retorna a documentação narrativa e estruturada das permissões
        de cada módulo registrado.\n\n    Inclui **cortex** (níveis L1–L3), **infraestrutura**
        (capacidades booleanas, secoes\n    estruturadas, acesso total de admin/superuser,
        elegibilidade do solicitante) e\n    **transporte** (capacidades `gerenciar`
        para L3, `reservar` para aluno elegível e\n    `conferir` para L3 ou colaborador
        com função). Novos módulos\n    entram automaticamente ao implementar `documentacao_<modulo>()`.\n\n
        \   **Permissões:** Qualquer usuário autenticado.\n\n    **Manutenção:** toda
        alteração de regra de permissão deve atualizar o método\n    `documentacao_<modulo>()`
        correspondente em `Identidade.usuarios.documentacao`.\n    "
      summary: Documentação de permissões por módulo
      tags:
      - Identidade
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Documentação obtida com sucesso.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
  /cortex/identidade/usuarios/:
    get:
      operationId: identidade_usuarios_list
      description: "\n    Retorna a lista paginada de usuários do sistema.\n\n    **Permissões:**
        Autenticado. L2+ (LER_TUDO) lista todos; L1 (EDITAR_EU) vê apenas o próprio
        registro.\n\n    **Query params:**\n    - `ativo` (bool, opcional): filtra
        por status — `true` (ativos) ou `false` (inativos).\n      Omitindo o parâmetro,
        retorna todos.\n    - `nome` (str, opcional): filtra por parte do nome (ignorando
        maiúsculas e minúsculas).\n    - `cpf` (str, opcional): filtra por parte do
        CPF.\n    - `email` (str, opcional): filtra por parte do e-mail (ignorando
        maiúsculas e minúsculas).\n    - `tipo_perfil` (str, opcional): filtra por
        tipo de perfil: `alunos` (ou `aluno`), `terceirizados` (ou `terceirizado`)
        ou `servidores` (ou `servidor`).\n    - `paginacao` (int, opcional): tamanho
        da página, entre 1 e 100. Padrão: 10.\n\n    **Segurança:** os query params
        apenas restringem o conjunto de resultados dentro do\n    escopo já autorizado
        — nunca expandem o acesso além do permitido pela permissão.\n    "
      summary: Listar usuários
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
        description: Filtra por status ativo (true) ou inativo (false).
      - in: query
        name: cpf
        schema:
          type: string
        description: Filtra por parte do CPF do usuário.
      - in: query
        name: email
        schema:
          type: string
        description: Filtra por parte do e-mail do usuário.
      - in: query
        name: nome
        schema:
          type: string
        description: Filtra por parte do nome do usuário.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Tamanho da página (1–100, padrão 10).
      - in: query
        name: tipo_perfil
        schema:
          type: string
          enum:
          - aluno
          - alunos
          - servidor
          - servidores
          - terceirizado
          - terceirizados
        description: 'Filtra por tipo de perfil: aluno/alunos, terceirizado/terceirizados
          ou servidor/servidores.'
      tags:
      - Identidade
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
    post:
      operationId: identidade_usuarios_create
      description: "\n    Cria um novo usuário no sistema.\n\n    **Permissões:**
        Apenas administradores.\n\n    Não há auto-cadastro — usuários são sempre
        criados por administradores,\n    individualmente ou em lote via JSON.\n\n
        \   **Normalização de Deficiência (campo `deficiencia`):**\n    O campo é
        normalizado automaticamente no save (removendo acentos, convertendo para caixa
        baixa e substituindo espaços por `_`).\n    - Opções válidas resultantes:
        `deficiencia_intelectual`, `deficiencia_visual`, `deficiencia_auditiva`, `deficiencia_multipla`,
        `deficiencia_fisica`.\n    - Se a string enviada (ex: \"Deficiência Múltipla\")
        equivaler a uma das chaves após a normalização, ela será associada.\n    -
        Se não houver correspondência, o valor será gravado como `null`.\n    "
      summary: Criar usuário
      tags:
      - Identidade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuario'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarUsuario'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarUsuario'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou CPF já cadastrado.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
