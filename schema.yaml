        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
    patch:
