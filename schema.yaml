      - in: query
        name: empresa_id
        schema:
          type: integer
      - in: query
        name: funcao_id
        schema:
          type: integer
      - in: query
        name: nome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
      - in: query
