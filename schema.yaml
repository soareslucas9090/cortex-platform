      - in: query
        name: nome
        schema:
          type: string
        description: Filtra por parte do nome do solicitante.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
      - in: query
        name: recurso_id
        schema:
          type: integer
        description: ID de um recurso (pode repetir o parâmetro para vários recursos).
      - in: query
        name: recurso_ids
        schema:
          type: integer
        description: IDs de recursos (repetir o parâmetro ou separar por vírgula).
      tags:
