        data_inicio:
          type: string
          format: date
          nullable: true
          title: Data de Início
          description: Data de início do vínculo terceirizado.
        data_fim:
          type: string
          format: date
          nullable: true
          title: Data de Término
          description: Data de término do vínculo. Nulo indica vínculo em aberto.
        ativo:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cargo_funcao
      - created_at
      - empresa_instituicao
      - empresa_nome
      - pk
      - updated_at
      - usuario_cpf
      - usuario_nome
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    TurnoEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      type: integer
      description: |-
        * `1` - Matutino
        * `2` - Vespertino
        * `3` - Noturno
        * `4` - Integral
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cpf:
          type: string
          nullable: true
          maxLength: 11
        nome:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
          title: E-mail
          maxLength: 254
        ativo:
          type: boolean
        is_admin:
          type: boolean
          title: Administrador
        foto:
          type: string
          format: uri
          nullable: true
        deficiencia:
          type: string
          title: Deficiência / necessidade especial
        tem_perfil_aluno:
          type: boolean
          description: |-
            Indica se o usuário possui um perfil acadêmico associado.
            Detectado via reverse relation nativa do Django, sem importar
            models do domínio Acadêmico dentro do domínio Identidade.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
      required:
      - created_at
      - id
      - nome
      - tem_perfil_aluno
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
