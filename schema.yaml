      description: "\n    Retorna usuários que podem ser **responsáveis** (quem entrega
        o recurso) no empréstimo.\n\n    - Conta **não coletiva**: apenas o próprio
        usuário autenticado.\n    - Conta **coletiva** (`usuario_coletivo`): pool
        definido pelas associações\n      (empresas, cargos, funções, setores) da
        conta.\n\n    Query params apenas **reduzem** o conjunto retornado; nunca
        expandem o acesso\n    além do pool permitido para a conta autenticada.\n\n
        \   **Permissões:** Capacidade `operar` em Infraestrutura.\n    "
