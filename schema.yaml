      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Infraestrutura · Recursos
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                foto:
                  type: string
                  format: binary
                  description: Arquivo de imagem (JPEG, PNG ou WebP, até 3 MB). Retrato
                    3:4, mínimo 480×640 após recorte.
              required:
              - foto
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Arquivo inválido.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Recurso não encontrado.
          description: ''
