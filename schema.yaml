openapi: 3.0.3
info:
  title: Cortex
  version: 1.0.0
paths:
  /cortex/academico/aluno-cursos/:
    get:
      operationId: academico_aluno_cursos_list
      description: "\n    Lista os vínculos acadêmicos entre alunos e cursos.\n\n
        \   **Permissões:** Autenticado. L2+ lista todos; L1 vê apenas vínculos do
        próprio usuário.\n\n    **Paginação:** Suportada via query param `paginacao`
        (padrão 10, máximo 100).\n\n    **Filtros:** Os query params apenas reduzem
        o conjunto de resultados — nunca expandem o acesso além do que a permissão
        do usuário já permite.\n    "
      summary: Listar vínculos aluno-curso
      parameters:
      - in: query
        name: aluno
        schema:
          type: integer
        description: Filtra pelo ID do aluno.
      - in: query
        name: ativo
        schema:
          type: boolean
        description: 'Filtra por status: true = Ativo, false = Encerrado.'
      - in: query
        name: curso
        schema:
          type: integer
        description: Filtra pelo ID do curso.
      - in: query
        name: nome_aluno
        schema:
          type: string
        description: Filtra por parte do nome do aluno (ignora acentos e maiúsculas).
      - in: query
        name: nome_curso
        schema:
          type: string
        description: Filtra por parte do nome do curso (ignora acentos e maiúsculas).
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Tamanho da página (1–100, padrão 10).
      tags:
      - Aluno-Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoCursoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
    post:
      operationId: academico_aluno_cursos_create
      description: "\n    Cria um novo vínculo acadêmico entre um aluno e um curso.\n\n
        \   **Permissões:** Apenas administradores.\n\n    Não é possível criar um
        segundo vínculo ativo do mesmo aluno no mesmo curso.\n    "
      summary: Criar vínculo aluno-curso
      tags:
      - Aluno-Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarAlunoCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarAlunoCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarAlunoCurso'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou vínculo já existente.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
  /cortex/academico/aluno-cursos/{id}/:
    get:
      operationId: academico_aluno_cursos_retrieve
      description: "\n    Exibe os detalhes de um vínculo acadêmico específico.\n\n
        \   **Permissões:** L2+ ou dono do vínculo (aluno vinculado).\n    "
      summary: Detalhar vínculo aluno-curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Aluno-Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Vínculo não encontrado.
          description: ''
    patch:
      operationId: academico_aluno_cursos_partial_update
      description: "\n    Atualiza parcialmente os dados de um vínculo acadêmico (ex:
        ano_conclusao, ativo).\n\n    **Permissões:** Apenas administradores.\n    "
      summary: Atualizar vínculo aluno-curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Aluno-Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAlunoCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAlunoCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAlunoCurso'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Vínculo não encontrado.
          description: ''
  /cortex/academico/aluno-cursos/{id}/encerrar/:
    post:
      operationId: academico_aluno_cursos_encerrar_create
      description: "\n    Encerra um vínculo acadêmico ativo, registrando o ano de
        conclusão.\n\n    **Permissões:** Apenas administradores.\n    "
      summary: Encerrar vínculo aluno-curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Aluno-Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncerrarAlunoCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EncerrarAlunoCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EncerrarAlunoCurso'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Vínculo já encerrado ou dados inválidos.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Vínculo não encontrado.
          description: ''
  /cortex/academico/alunos/:
    get:
      operationId: academico_alunos_list
      description: "\n    Retorna a lista de alunos cadastrados.\n\n    **Permissões:**
        Autenticado. L2+ (LER_TUDO) lista todos; L1 (EDITAR_EU) vê apenas o próprio.\n\n
        \   **Filtros:** Os query params apenas reduzem o conjunto de resultados —
        nunca expandem o acesso.\n    "
      summary: Listar alunos
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
        description: Filtra alunos ativos/inativos.
      - in: query
        name: cpf
        schema:
          type: string
        description: Filtra por parte do CPF do aluno.
      - in: query
        name: nome
        schema:
          type: string
        description: Filtra por parte do nome do aluno (ignora acentos e maiúsculas).
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: paginacao
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: situacao
        schema:
          type: integer
        description: Filtra pela situação do aluno.
      tags:
      - Alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoList'
          description: ''
    post:
      operationId: academico_alunos_create
      description: "\n    Cria um novo perfil de aluno para um usuário existente.\n\n
        \   **Permissões:** L3 (EDITAR_TUDO) — administradores.\n    "
      summary: Criar aluno
      tags:
      - Alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarAluno'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarAluno'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarAluno'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /cortex/academico/alunos/{usuario_id}/:
    get:
      operationId: academico_alunos_retrieve
      description: "\n    Retorna os detalhes de um aluno.\n\n    **Permissões:**
        L2+ (LER_TUDO) ou dono do registro (L1).\n    "
      summary: Detalhar aluno
      parameters:
      - in: path
        name: usuario_id
        schema:
          type: integer
        required: true
      tags:
      - Alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    patch:
      operationId: academico_alunos_partial_update
      description: "\n    Atualiza os dados de um aluno existente.\n\n    **Permissões:**
        L3 (EDITAR_TUDO) — administradores.\n    "
      summary: Atualizar aluno
      parameters:
      - in: path
        name: usuario_id
        schema:
          type: integer
        required: true
      tags:
      - Alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAluno'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAluno'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAluno'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /cortex/academico/cursos/:
    get:
      operationId: academico_cursos_list
      description: "\n    Lista todos os cursos cadastrados.\n\n    **Permissões:**
        Qualquer usuário autenticado (catálogo de referência). Escrita apenas L3 (EDITAR_TUDO).\n\n
        \   **Paginação:** Suportada via query param `paginacao` (padrão 10, máximo
        100).\n\n    **Filtros:** Os query params apenas reduzem o conjunto de resultados
        — nunca expandem o acesso além do que a permissão do usuário já permite.\n
        \   "
      summary: Listar cursos
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
        description: 'Filtra por status: true = Ativo, false = Inativo.'
      - in: query
        name: codigo_curso
        schema:
          type: string
        description: Filtra por parte do código do curso.
      - in: query
        name: nome
        schema:
          type: string
        description: Filtra por parte do nome do curso (ignora acentos e maiúsculas).
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Tamanho da página (1–100, padrão 10).
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCursoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
    post:
      operationId: academico_cursos_create
      description: "\n    Cria um novo curso.\n\n    **Permissões:** Qualquer usuário
        autenticado (catálogo de referência). Escrita apenas L3 (EDITAR_TUDO).\n    "
      summary: Criar curso
      tags:
      - Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarCurso'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou código de curso já em uso.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
  /cortex/academico/cursos/{id}/:
    get:
      operationId: academico_cursos_retrieve
      description: "\n    Exibe os detalhes de um curso específico.\n\n    **Permissões:**
