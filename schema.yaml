    ProjectMe:
      type: object
      description: |-
        Serializer do endpoint /me/ customizado para incluir permissões do usuário.
        Inclui ``usuario_coletivo`` (campo do model) e indicadores de perfil.
      properties:
        id:
          type: integer
          readOnly: true
        permissoes:
          readOnly: true
        tem_perfil_aluno:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
          title: Último login
        is_superuser:
          type: boolean
          title: Status de superusuário
          description: Indica que este usuário tem todas as permissões sem atribuí-las
            explicitamente.
        nome:
          type: string
          maxLength: 255
        ativo:
          type: boolean
        is_admin:
          type: boolean
          title: Administrador
        is_staff:
          type: boolean
          title: Staff
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
        email:
          type: string
          format: email
          nullable: true
          title: E-mail
          maxLength: 254
        cpf:
          type: string
          nullable: true
          maxLength: 11
        foto:
          type: string
          format: uri
          nullable: true
          title: Foto primária
          description: URL pública da foto vinda de sistemas externos.
          maxLength: 500
        foto_secundaria:
          type: string
          nullable: true
          title: Foto secundária
          description: Chave S3 da foto enviada pelo próprio usuário (servida via
            proxy da API).
          maxLength: 500
        deficiencia:
          nullable: true
          title: Deficiência / necessidade especial
          oneOf:
          - $ref: '#/components/schemas/DeficienciaEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        colaborador_externo:
          type: boolean
          description: Indica se o usuário é colaborador externo à instituição.
        usuario_coletivo:
          type: boolean
          title: Usuário coletivo
          description: 'Conta compartilhada (ex.: guarita). No empréstimo, o responsável
            deve ser escolhido entre os usuários do pool associado.'
        empresas_coletivo:
          type: array
          items:
            type: integer
            title: Empresas do pool coletivo
          title: Empresas do pool coletivo
        cargos_coletivo:
          type: array
          items:
            type: integer
            title: Cargos do pool coletivo
          title: Cargos do pool coletivo
        funcoes_coletivo:
          type: array
          items:
            type: integer
            title: Funções do pool coletivo
          title: Funções do pool coletivo
        setores_coletivo:
          type: array
          items:
            type: integer
            title: Setores do pool coletivo
          title: Setores do pool coletivo
      required:
      - created_at
      - id
      - nome
      - permissoes
      - tem_perfil_aluno
      - updated_at
