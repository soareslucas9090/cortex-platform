openapi: 3.0.3
info:
  title: Cortex
  version: 1.0.0
paths:
  /academico/aluno-cursos/:
    get:
      operationId: academico_aluno_cursos_list
      description: "\n    Lista os vínculos acadêmicos entre alunos e cursos.\n\n\
        \    **Permissões:** Apenas administradores.\n\n    **Paginação:** Suportada\
        \ via query param `paginacao` (padrão 10, máximo 100).\n\n    **Filtros:**\
        \ Os query params apenas reduzem o conjunto de resultados — nunca expandem\
        \ o acesso além do que a permissão do usuário já permite.\n    "
      summary: Listar vínculos aluno-curso
      parameters:
      - in: query
        name: aluno
        schema:
          type: integer
        description: Filtra pelo ID do aluno.
      - in: query
        name: ativo
        schema:
          type: boolean
        description: 'Filtra por status: true = Ativo, false = Encerrado.'
      - in: query
        name: curso
        schema:
          type: integer
        description: Filtra pelo ID do curso.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Tamanho da página (1–100, padrão 10).
      tags:
      - Aluno-Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoCursoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
    post:
      operationId: academico_aluno_cursos_create
      description: "\n    Cria um novo vínculo acadêmico entre um aluno e um curso.\n\
        \n    **Permissões:** Apenas administradores.\n\n    Não é possível criar\
        \ um segundo vínculo ativo do mesmo aluno no mesmo curso.\n    "
      summary: Criar vínculo aluno-curso
      tags:
      - Aluno-Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarAlunoCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarAlunoCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarAlunoCurso'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou vínculo já existente.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
  /academico/aluno-cursos/{id}/:
    get:
      operationId: academico_aluno_cursos_retrieve
      description: "\n    Exibe os detalhes de um vínculo acadêmico específico.\n\n\
        \    **Permissões:** Apenas administradores.\n    "
      summary: Detalhar vínculo aluno-curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Aluno-Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Vínculo não encontrado.
          description: ''
    patch:
      operationId: academico_aluno_cursos_partial_update
      description: "\n    Atualiza parcialmente os dados de um vínculo acadêmico (ex:\
        \ ano_conclusao, ativo).\n\n    **Permissões:** Apenas administradores.\n\
        \    "
      summary: Atualizar vínculo aluno-curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Aluno-Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAlunoCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAlunoCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAlunoCurso'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Vínculo não encontrado.
          description: ''
  /academico/aluno-cursos/{id}/encerrar/:
    post:
      operationId: academico_aluno_cursos_encerrar_create
      description: "\n    Encerra um vínculo acadêmico ativo, registrando o ano de\
        \ conclusão.\n\n    **Permissões:** Apenas administradores.\n    "
      summary: Encerrar vínculo aluno-curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Aluno-Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncerrarAlunoCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EncerrarAlunoCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EncerrarAlunoCurso'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlunoCurso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Vínculo já encerrado ou dados inválidos.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Vínculo não encontrado.
          description: ''
  /academico/alunos/:
    get:
      operationId: academico_alunos_list
      description: Retorna a lista de alunos cadastrados. Apenas administradores.
      summary: Listar alunos
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
        description: Filtra alunos ativos/inativos.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: paginacao
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: situacao
        schema:
          type: integer
        description: Filtra pela situação do aluno.
      tags:
      - Alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlunoList'
          description: ''
    post:
      operationId: academico_alunos_create
      description: Cria um novo perfil de aluno para um usuário existente. Apenas
        administradores.
      summary: Criar aluno
      tags:
      - Alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarAluno'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarAluno'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarAluno'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /academico/alunos/{usuario_id}/:
    get:
      operationId: academico_alunos_retrieve
      description: Retorna os detalhes de um aluno. Apenas administradores.
      summary: Detalhar aluno
      parameters:
      - in: path
        name: usuario_id
        schema:
          type: integer
        required: true
      tags:
      - Alunos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
    patch:
      operationId: academico_alunos_partial_update
      description: Atualiza os dados de um aluno existente. Apenas administradores.
      summary: Atualizar aluno
      parameters:
      - in: path
        name: usuario_id
        schema:
          type: integer
        required: true
      tags:
      - Alunos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAluno'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAluno'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarAluno'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aluno'
          description: ''
  /academico/cursos/:
    get:
      operationId: academico_cursos_list
      description: "\n    Lista todos os cursos cadastrados.\n\n    **Permissões:**\
        \ Apenas administradores.\n\n    **Paginação:** Suportada via query param\
        \ `paginacao` (padrão 10, máximo 100).\n\n    **Filtros:** Os query params\
        \ apenas reduzem o conjunto de resultados — nunca expandem o acesso além do\
        \ que a permissão do usuário já permite.\n    "
      summary: Listar cursos
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
        description: 'Filtra por status: true = Ativo, false = Inativo.'
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Tamanho da página (1–100, padrão 10).
      - in: query
        name: turno
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
        description: 'Filtra por turno: 1 = Matutino, 2 = Vespertino, 3 = Noturno,
          4 = Integral.'
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCursoList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
    post:
      operationId: academico_cursos_create
      description: "\n    Cria um novo curso.\n\n    **Permissões:** Apenas administradores.\n\
        \    "
      summary: Criar curso
      tags:
      - Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarCurso'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou código de curso já em uso.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
  /academico/cursos/{id}/:
    get:
      operationId: academico_cursos_retrieve
      description: "\n    Exibe os detalhes de um curso específico.\n\n    **Permissões:**\
        \ Apenas administradores.\n    "
      summary: Detalhar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
    patch:
      operationId: academico_cursos_partial_update
      description: "\n    Atualiza parcialmente os dados de um curso existente.\n\n\
        \    **Permissões:** Apenas administradores.\n    "
      summary: Atualizar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarCurso'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarCurso'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAtualizarCurso'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Dados inválidos ou código já em uso.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
  /academico/cursos/{id}/desativar/:
    post:
      operationId: academico_cursos_desativar_create
      description: "\n    Desativa um curso ativo.\n\n    **Permissões:** Apenas administradores.\n\
        \    "
      summary: Desativar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Curso já está inativo.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
  /academico/cursos/{id}/reativar/:
    post:
      operationId: academico_cursos_reativar_create
      description: "\n    Reativa um curso inativo.\n\n    **Permissões:** Apenas\
        \ administradores.\n    "
      summary: Reativar curso
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cursos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Curso já está ativo.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão.
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Curso não encontrado.
          description: ''
  /auth/token_jwt/:
    post:
      operationId: auth_token_jwt_create
      description: "\n        Autentica o usuário e retorna os tokens de acesso (access)\
        \ e renovação (refresh).\n\n        O campo ``login`` aceita **e-mail** ou\
        \ **CPF** (com ou sem máscara).\n\n        **Exemplos de identificador:**\n\
        \        - E-mail: `usuario@email.com`\n        - CPF sem máscara: `12345678901`\n\
        \        - CPF com máscara: `123.456.789-01`\n\n        **Token de acesso:**\
        \ válido por 1 dia.\n        **Token de renovação:** válido por 7 dias.\n\n\
        \        Em caso de falha, a resposta é sempre genérica e não revela\n   \
        \     o motivo específico (usuário inexistente, senha incorreta ou inativo).\n\
        \        "
      summary: Login — obter tokens JWT
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Credenciais inválidas.
          description: ''
  /auth/token_jwt/me/:
    get:
      operationId: auth_token_jwt_me_retrieve
      description: Retorna as informações do usuário atual.
      summary: Dados do usuário logado
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
  /auth/token_jwt/refresh/:
    post:
      operationId: auth_token_jwt_refresh_create
      description: Usa o refresh token para emitir um novo access token sem precisar
        de nova autenticação.
      summary: Renovar token de acesso
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Novo access token gerado.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Refresh token inválido ou expirado.
          description: ''
  /auth/token_jwt/verify/:
    post:
      operationId: auth_token_jwt_verify_create
      description: Retorna 200 se o token for válido, 401 caso contrário.
      summary: Verificar validade do token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Token válido.
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Token inválido ou expirado.
          description: ''
  /identidade/usuarios/:
    get:
      operationId: identidade_usuarios_list
      description: "\n    Retorna a lista paginada de usuários do sistema.\n\n   \
        \ **Permissões:** Apenas administradores.\n\n    **Query params:**\n    -\
        \ `ativo` (bool, opcional): filtra por status — `true` (ativos) ou `false`\
        \ (inativos).\n      Omitindo o parâmetro, retorna todos.\n    - `paginacao`\
        \ (int, opcional): tamanho da página, entre 1 e 100. Padrão: 10.\n\n    **Segurança:**\
        \ os query params apenas restringem o conjunto de resultados dentro do\n \
        \   escopo já autorizado — nunca expandem o acesso além do permitido pela\
        \ permissão.\n    "
      summary: Listar usuários
      parameters:
      - in: query
        name: ativo
        schema:
          type: boolean
        description: Filtra por status ativo (true) ou inativo (false).
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
        description: Tamanho da página (1–100, padrão 10).
      tags:
      - Identidade
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Não autenticado.
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Sem permissão de administrador.
          description: ''
    post:
      operationId: identidade_usuarios_create
      description: "\n    Cria um novo usuário no sistema.\n\n    **Permissões:**\
        \ Apenas administradores.\n\n    Não há auto-cadastro — usuários são sempre\
        \ criados por administradores,\n    individualmente ou em lote via JSON.\n\
        \    "
      summary: Criar usuário
      tags:
      - Identidade
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuario'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CriarUsuario'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CriarUsuario'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
        '400':
          content:
