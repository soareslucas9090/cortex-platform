        (L1): apenas empréstimos ativos do próprio solicitante.\n\n    Ordenação padrão:
        empréstimos **abertos** primeiro (mais recentes primeiro),\n    depois os
        **fechados** (mais recentes primeiro).\n\n    **Permissões:** Usuário autenticado
        (escopo conforme capacidade `operar`).\n    "
      summary: Listar empréstimos
      parameters:
      - in: query
