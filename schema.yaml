          type: boolean
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: paginacao
        schema:
          type: integer
      - in: query
        name: recurso_id
        schema:
          type: integer
      - in: query
        name: responsavel_id
        schema:
          type: integer
      - in: query
        name: solicitante_id
        schema:
          type: integer
      - in: query
        name: tipo_recurso
        schema:
          type: string
      tags:
      - Infraestrutura · Empréstimos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmprestimoList'
          description: ''
    post:
      operationId: infraestrutura_emprestimos_create
      description: "\n    Registra retirada multi-item para um solicitante.\n\n  -
        Conta não coletiva: o responsável é o próprio usuário autenticado.\n  - Conta
        coletiva: informe `responsavel_id` com um usuário do pool elegível.\n\n    **Permissões:**
        Capacidade `operar` em Infraestrutura.\n    "
      summary: Realizar empréstimo
      tags:
      - Infraestrutura · Empréstimos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealizarEmprestimo'
          application/x-www-form-urlencoded:
