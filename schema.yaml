components:
  schemas:
    AdicionarMatricula:
      type: object
      properties:
        matricula:
          type: string
          description: Número da matrícula.
          maxLength: 50
      required:
      - matricula
    Aluno:
      type: object
      properties:
        usuario_id:
          type: integer
          readOnly: true
        usuario_nome:
          type: string
          readOnly: true
        usuario_cpf:
          type: string
          readOnly: true
        ira:
          type: number
          format: double
        situacao:
          allOf:
          - $ref: '#/components/schemas/SituacaoAlunoEnum'
          title: Situação
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        situacao_display:
          type: string
          readOnly: true
        forma_ingresso:
          allOf:
          - $ref: '#/components/schemas/FormaIngressoEnum'
          title: Forma de Ingresso
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        forma_ingresso_display:
          type: string
          readOnly: true
        ativo:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - forma_ingresso_display
      - situacao_display
      - usuario_cpf
      - usuario_id
      - usuario_nome
    AlunoCurso:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        aluno_id:
          type: integer
          title: Usuário
          readOnly: true
        aluno_nome:
          type: string
          readOnly: true
        aluno_cpf:
          type: string
          readOnly: true
        curso_id:
          type: integer
          readOnly: true
        curso_nome:
          type: string
          readOnly: true
        curso_codigo:
          type: string
          readOnly: true
        ano_conclusao:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          title: Ano de Conclusão
        ativo:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - aluno_cpf
      - aluno_id
      - aluno_nome
      - created_at
      - curso_codigo
      - curso_id
      - curso_nome
      - id
      - updated_at
    Cargo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 255
        ativo:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - nome
      - updated_at
    CategoriaEnum:
      enum:
      - 1
      - 2
      type: integer
      description: |-
        * `1` - Professor
        * `2` - Tec.Administrativo
    Contato:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email_academico:
          type: string
          format: email
          title: E-mail acadêmico
          maxLength: 254
        email_pessoal:
          type: string
          format: email
          title: E-mail pessoal
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
      required:
      - id
    ContatoInput:
      type: object
      properties:
        email_academico:
          type: string
          format: email
          default: ''
        email_pessoal:
          type: string
          format: email
          default: ''
        telefone:
          type: string
          default: ''
          maxLength: 20
    CriarAluno:
      type: object
      properties:
        usuario:
          type: integer
        ira:
          type: number
          format: double
        situacao:
          $ref: '#/components/schemas/SituacaoAlunoEnum'
        forma_ingresso:
          $ref: '#/components/schemas/FormaIngressoEnum'
        ativo:
          type: boolean
          default: true
      required:
      - usuario
    CriarAlunoCurso:
      type: object
      properties:
        aluno:
          type: integer
        curso:
          type: integer
        ano_conclusao:
          type: integer
          nullable: true
      required:
      - aluno
      - curso
    CriarCargo:
      type: object
      properties:
        nome:
          type: string
          maxLength: 255
        ativo:
          type: boolean
          default: true
      required:
      - nome
    CriarCurso:
      type: object
      properties:
        nome:
          type: string
          maxLength: 255
        codigo_curso:
          type: string
          maxLength: 50
        turno:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TurnoEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - codigo_curso
      - nome
    CriarEmpresaInstituicao:
      type: object
      properties:
        nome:
          type: string
          maxLength: 255
        cnpj:
          type: string
          maxLength: 14
        ativo:
          type: boolean
          default: true
      required:
      - nome
    CriarFuncao:
      type: object
      properties:
        sigla:
          type: string
          maxLength: 20
        descricao:
          type: string
          maxLength: 255
        e_gratificada:
          type: boolean
          default: false
        exige_aluno:
          type: boolean
          default: false
      required:
      - descricao
      - sigla
    CriarServidor:
      type: object
      properties:
        usuario_pk:
          type: integer
        cargo_pk:
          type: integer
        categoria:
          $ref: '#/components/schemas/CategoriaEnum'
        ativo:
          type: boolean
          default: true
      required:
      - cargo_pk
      - categoria
      - usuario_pk
    CriarSetor:
      type: object
      properties:
        nome:
          type: string
          maxLength: 255
        sigla:
          type: string
          maxLength: 20
      required:
      - nome
      - sigla
    CriarTerceirizado:
      type: object
      properties:
        usuario_pk:
          type: integer
        empresa_pk:
          type: integer
        cargo_funcao:
          type: string
          maxLength: 255
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
          nullable: true
        ativo:
          type: boolean
          default: true
      required:
      - cargo_funcao
      - data_inicio
      - empresa_pk
